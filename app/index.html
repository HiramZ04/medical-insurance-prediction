<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta 1="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insurance CO - Data Collection</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-wrapper">
    <main class="web-container">
      <div class="content-card">
        <header class="header-section">
          <span class="insurance-co">Insurance CO</span>
        </header>

        <div class="sections-scroll">

          <div class="data-section">
            <div class="title-container"><h2>Text-1</h2></div>
            <div class="border-box">
              <input type="text" id="text1" placeholder="input-1 ">
            </div>
          </div>

          <div class="data-section">
            <div class="title-container"><h2>Num-2</h2></div>
            <div class="border-box">
              <input type="number" id="num2" placeholder="num-2" min="0">
            </div>
          </div>

          <div class="data-section">
            <div class="title-container"><h2>Bool-3</h2></div>
            <div class="border-box">
              <div class="radio-wrapper">
                <label><input type="radio" name="bool3" value="opt1"> Female</label>
                <label><input type="radio" name="bool3" value="opt2"> Male</label>
              </div>
            </div>
          </div>

          <div class="data-section">
            <div class="title-container"><h2>Text-4</h2></div>
            <div class="border-box">
              <input type="text" id="text4" placeholder="input-4 ">
            </div>
          </div>


          <div class="data-section">
            <div class="title-container"><h2>Text-5</h2></div>
            <div class="border-box">
              <input type="text" id="text5" placeholder="input-5 ">
            </div>
          </div>


          <div class="data-section">
            <div class="title-container"><h2>Text-6</h2></div>
            <div class="border-box">
              <input type="text" id="text6" placeholder="input-6 ">
            </div>
          </div>

        </div>

        <button class="submit-btn" onclick="alert('Data submitted!')">Submit Data</button>
      </div>
    </main>
  </div>
  <script src="/main.js"></script>
</body>
</html>
